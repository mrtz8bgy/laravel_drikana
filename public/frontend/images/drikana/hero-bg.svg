<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07091a"/>
      <stop offset="50%" stop-color="#1a1f4d"/>
      <stop offset="100%" stop-color="#07091a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="0.6" fill="#d4af37" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow1)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>
  <!-- Decorative diamonds -->
  <g opacity="0.08" fill="#d4af37">
    <polygon points="120,150 145,175 120,200 95,175"/>
    <polygon points="1400,250 1425,275 1400,300 1375,275"/>
    <polygon points="200,700 220,720 200,740 180,720"/>
    <polygon points="1300,700 1320,720 1300,740 1280,720"/>
  </g>
  <!-- Light rays -->
  <g opacity="0.04">
    <polygon points="800,0 600,900 1000,900" fill="#d4af37"/>
  </g>
</svg>
